name: Pin workflow revisions

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Replace mutable workflow refs with selected immutable commits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v5': 'actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5',
              'actions/checkout@v6': 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6',
          }
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'pin-workflow-revisions.yml':
                  continue
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
          git rm .github/workflows/pin-workflow-revisions.yml
          git add .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: pin existing workflow revisions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
