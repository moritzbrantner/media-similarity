name: Add frontend static lint

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Add pinned static lint dependency and script
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          package = json.loads(path.read_text())
          scripts = package.setdefault('scripts', {})
          updated = {}
          for key, value in scripts.items():
              updated[key] = value
              if key == 'lint':
                  updated['lint:static'] = 'oxlint frontend tests/e2e scripts'
          if 'lint:static' not in updated:
              updated['lint:static'] = 'oxlint frontend tests/e2e scripts'
          package['scripts'] = updated
          package.setdefault('devDependencies', {})['oxlint'] = '1.80.0'
          path.write_text(json.dumps(package, indent=2) + '\n')
          PY
          bun install
          git rm .github/workflows/add-static-lint.yml
          git add package.json bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: add frontend static lint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
