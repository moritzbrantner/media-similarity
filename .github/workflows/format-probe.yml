name: Format probe

on:
  push:
    branches:
      - feat/github-pages-audio-video

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository Bun
        run: |
          set -euo pipefail
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print canonical formatter diff
        run: |
          bun run format
          git diff -- frontend/src/showcase/MediaDemo.tsx frontend/src/showcase/audioSamples.ts frontend/src/showcase/showcaseRuntime.ts frontend/src/showcase/videoSamples.ts
