name: Foundation diagnostic

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-foundation-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print undocumented explicit environment variables
        shell: python
        run: |
          import re
          from pathlib import Path

          ambient_exact = {
              'CI','HOME','PATH','PWD','OLDPWD','SHELL','USER','LOGNAME','TMP','TEMP','TMPDIR','XDG_CACHE_HOME'
          }
          ambient_prefixes = ('ACTIONS_', 'GITHUB_', 'RUNNER_')
          patterns = [
              re.compile(r'\b(?:process|Bun)\.env\.([A-Z][A-Z0-9_]*)\b'),
              re.compile(r'\bimport\.meta\.env\.([A-Z][A-Z0-9_]*)\b'),
              re.compile(r'\bDeno\.env\.get\(\s*["\']([A-Z][A-Z0-9_]*)["\']\s*\)'),
              re.compile(r'\b(?:std::)?env::var(?:_os)?\(\s*["\']([A-Z][A-Z0-9_]*)["\']\s*\)'),
              re.compile(r'\bEnvironment\.GetEnvironmentVariable\(\s*["\']([A-Z][A-Z0-9_]*)["\']\s*\)'),
          ]
          skipped = {'.git','node_modules','target','dist','build','coverage','.artifacts','.cache','vendor','playwright-report','test-results','storybook-static'}
          used = {}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skipped for part in path.parts):
                  continue
              if path.name == '.env.example':
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              for pattern in patterns:
                  for match in pattern.finditer(text):
                      key = match.group(1)
                      if key in ambient_exact or any(key.startswith(prefix) for prefix in ambient_prefixes):
                          continue
                      used.setdefault(key, set()).add(str(path))
          documented = set()
          for line in Path('.env.example').read_text().splitlines():
              match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=', line)
              if match:
                  documented.add(match.group(1))
          missing = sorted(set(used) - documented)
          print('MISSING_KEYS=' + ','.join(missing))
          for key in missing:
              print(key + ': ' + ', '.join(sorted(used[key])))
          if missing:
              raise SystemExit(1)
      - name: Format package manifest
        if: always()
        shell: bash
        run: |
          bunx oxfmt --write package.json
          git add package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format package manifest"
          git push origin HEAD:chore/repository-foundation-v1
