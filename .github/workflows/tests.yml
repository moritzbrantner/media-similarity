name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"

          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Set up repository Bun
        run: |
          set -euo pipefail
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Type-check and build frontend
        run: bun run build

      - name: Build Storybook
        run: bun run storybook:build

      - name: Check generated frontend bundle
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- frontend/dist; then
            echo "::error::frontend/dist is out of date; run \`bun run build\` and commit the generated bundle."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Install Puppeteer Chrome
        run: bunx puppeteer browsers install chrome

      - name: Run Unlighthouse performance audit
        run: bun run test:perf

      - name: Run Playwright tests
        run: bun run test:e2e

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"

          mkdir -p image-similarity-service
          cd image-similarity-service
          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Set up repository Rust
        working-directory: image-similarity-service
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "$toolchain" --profile minimal
          while IFS= read -r component; do
            rustup component add --toolchain "$toolchain" "$component"
          done < <(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              for component in tomllib.load(handle)['toolchain'].get('components', []):
                  print(component)
          PY
          )

      - name: Check formatting
        working-directory: image-similarity-service
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Run Clippy
        working-directory: image-similarity-service
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: image-similarity-service
        run: cargo test --manifest-path backend/Cargo.toml
