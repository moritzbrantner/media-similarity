name: Source mode contract

on:
  pull_request:
    paths:
      - ".coding-tooling.source-deps.json"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"
  push:
    branches: [main]
    paths:
      - ".coding-tooling.source-deps.json"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    name: local-only source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify local-only dependency declaration
        run: |
          jq -e '
            .schemaVersion == 2 and
            .cargo.localOnly == true and
            (.cargo.patches | type == "array") and
            all(.cargo.patches[];
              (.package | length > 0) and
              (.git | length > 0) and
              (.rev | test("^[0-9a-f]{40}$")) and
              (.localPath | length > 0)
            )
          ' .coding-tooling.source-deps.json >/dev/null
      - name: Explain verification boundary
        run: |
          echo "Normal development uses versioned capability dependencies with no ambient source patches."
          echo "Cross-repository work may activate exact local-only sibling revisions for the task, then remove them again."
          echo "Hosted CI remains repository-local; registry-only proof is a later distribution gate."
