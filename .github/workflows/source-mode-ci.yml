name: Source mode contract

on:
  pull_request:
    paths:
      - ".coding-tooling.source-deps.json"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"
  push:
    branches: [main]
    paths:
      - ".coding-tooling.source-deps.json"
      - "AGENTS.md"
      - ".github/workflows/source-mode-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    name: local-only source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify local-only dependency declaration
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null
      - name: Explain verification boundary
        run: |
          echo "Cross-repository source builds run in the local agent workspace using exact sibling revisions."
          echo "Hosted CI remains repository-local; registry-only proof is a later distribution gate."
