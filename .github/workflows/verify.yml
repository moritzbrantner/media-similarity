name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asset-validation: ${{ steps.scope.outputs.asset-validation }}
      environment-validation: ${{ steps.scope.outputs.environment-validation }}
      pages-validation: ${{ steps.scope.outputs.pages-validation }}
      performance-validation: ${{ steps.scope.outputs.performance-validation }}
      foundation-validation: ${{ steps.scope.outputs.foundation-validation }}
      source-mode-validation: ${{ steps.scope.outputs.source-mode-validation }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'asset-validation': {}, 'environment-validation': {'paths': ['.repository-environment.toml', '.coding-tooling.source-deps.json', 'scripts/codex-environment.sh', 'package.json', 'bun.lock', 'rust-toolchain.toml', 'backend/Cargo.toml', 'backend/Cargo.lock', 'Dockerfile', '.github/workflows/environment-v1.yml', '.github/workflows/verify.yml']}, 'pages-validation': {}, 'performance-validation': {}, 'foundation-validation': {}, 'source-mode-validation': {'paths': ['.coding-tooling.source-deps.json', 'AGENTS.md', '.github/workflows/source-mode-ci.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print("allow-skipped=" + json.dumps([job for job, active in selected.items() if not active]), file=output)

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"

          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Check dependency architecture
        run: python3 scripts/check_dependency_boundaries.py

      - name: Set up repository Bun
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency architecture guard
        run: bun test scripts/check_dependency_boundaries.test.mjs

      - name: Test one-command showcase diagnostics
        run: bun run test:showcase

      - name: Check frontend formatting
        run: bun run format:check

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build Storybook
        run: bun run storybook:build

      - name: Build frontend into temporary directory
        run: |
          set -euo pipefail
          rm -rf /tmp/image-similarity-service-frontend-dist
          bunx vite build --outDir /tmp/image-similarity-service-frontend-dist

      - name: Compare checked-in frontend bundle
        run: diff -qr frontend/dist /tmp/image-similarity-service-frontend-dist

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Install Puppeteer Chrome
        run: bunx puppeteer browsers install chrome

      - name: Run Unlighthouse performance audit
        run: bun run test:perf

      - name: Run Playwright tests
        run: bun run test:e2e

  rust-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"

          mkdir -p image-similarity-service
          cd image-similarity-service
          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Install declared system packages
        uses: moritzbrantner/reusable-workflows/.github/actions/install-system-packages@b712d9f2c4a3590567776b75bec9894b0f0ba76c # main
        with:
          working_directory: image-similarity-service
          environment_file: .repository-environment.toml

      - name: Prepare declared repository environment
        working-directory: image-similarity-service
        run: bash scripts/codex-environment.sh setup

      - name: Check Rust formatting
        working-directory: image-similarity-service
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Run Clippy with committed lockfile
        working-directory: image-similarity-service
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Build Rust binaries with committed lockfile
        working-directory: image-similarity-service
        run: cargo build --manifest-path backend/Cargo.toml --locked

      - name: Run Rust tests with committed lockfile
        working-directory: image-similarity-service
        run: cargo test --manifest-path backend/Cargo.toml --locked

      - name: Verify the standalone text shim
        working-directory: image-similarity-service
        shell: bash
        run: |
          set -euo pipefail
          for manifest in backend/shims/text-analysis-core/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --manifest-path "$manifest" --all-targets --all-features --locked -- -D warnings
            cargo build --manifest-path "$manifest" --locked
            cargo test --manifest-path "$manifest" --locked --lib
          done

  qdrant-smoke:
    runs-on: ubuntu-latest
    needs: rust-verify
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"

          mkdir -p image-similarity-service
          cd image-similarity-service
          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Install declared system packages
        uses: moritzbrantner/reusable-workflows/.github/actions/install-system-packages@b712d9f2c4a3590567776b75bec9894b0f0ba76c # main
        with:
          working_directory: image-similarity-service
          environment_file: .repository-environment.toml

      - name: Prepare declared repository environment
        working-directory: image-similarity-service
        run: bash scripts/codex-environment.sh setup

      - name: Run real Qdrant smoke test
        working-directory: image-similarity-service
        env:
          COMPOSE_SERVICES: qdrant
          QDRANT_URL: http://127.0.0.1:6333
        run: |
          bash scripts/run-with-compose-services.sh cargo test --manifest-path backend/Cargo.toml --locked qdrant_smoke -- --ignored --nocapture

  asset-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.asset-validation == 'true'
    uses: ./.github/workflows/asset-tooling-quality-contract.yml
    secrets: inherit

  environment-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.environment-validation == 'true'
    uses: ./.github/workflows/environment-v1.yml
    secrets: inherit
    permissions:
      contents: read

  pages-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.pages-validation == 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  performance-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.performance-validation == 'true'
    uses: ./.github/workflows/performance-smoke.yml
    secrets: inherit
    permissions:
      contents: read

  foundation-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.foundation-validation == 'true'
    uses: ./.github/workflows/repository-foundation.yml
    secrets: inherit
    permissions:
      contents: read

  source-mode-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.source-mode-validation == 'true'
    uses: ./.github/workflows/source-mode-ci.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["frontend-verify", "rust-verify", "qdrant-smoke", "validation-scope", "asset-validation", "environment-validation", "pages-validation", "performance-validation", "foundation-validation", "source-mode-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["frontend-verify", "rust-verify", "qdrant-smoke", "validation-scope", "asset-validation", "environment-validation", "pages-validation", "performance-validation", "foundation-validation", "source-mode-validation"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
