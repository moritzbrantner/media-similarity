name: Repository foundation

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run repository policy lint
        uses: moritzbrantner/coding-tooling@a630598d369ac94d0f549dce5c859b9dd28b250c
        with:
          operation: run
          tier: policy
          component: .
          strict: true
          bun-version: latest
          install-mode: none
          report-path: .artifacts/coding-tooling/policy.json

      - name: Verify repository conformance
        uses: moritzbrantner/coding-tooling@a630598d369ac94d0f549dce5c859b9dd28b250c
        with:
          operation: conformance
          bun-version: latest
          install-mode: none
          report-path: .artifacts/coding-tooling/conformance.json
