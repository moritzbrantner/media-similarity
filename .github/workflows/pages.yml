name: GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Fix observed showcase promises
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/showcase/ShowcasePage.tsx")
          text = path.read_text()

          old_prepare = "    void prepare();\n"
          new_prepare = '''    prepare().catch((cause) => {\n      if (!cancelled) {\n        setError(cause instanceof Error ? cause.message : String(cause));\n        setStatus("error");\n      }\n    });\n'''
          if old_prepare not in text:
              raise SystemExit("prepare() floating-promise pattern not found")
          text = text.replace(old_prepare, new_prepare, 1)

          old_upload = '''                onChange={(event) => void uploadQuery(event.currentTarget.files?.[0])}\n'''
          new_upload = '''                onChange={(event) => {\n                  uploadQuery(event.currentTarget.files?.[0]).catch((cause) => {\n                    setError(cause instanceof Error ? cause.message : String(cause));\n                  });\n                }}\n'''
          if old_upload not in text:
              raise SystemExit("uploadQuery() floating-promise pattern not found")
          text = text.replace(old_upload, new_upload, 1)
          path.write_text(text)
          PY
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bunx oxfmt frontend/src/showcase/ShowcasePage.tsx
          git add frontend/src/showcase/ShowcasePage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: observe showcase promises"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Set up repository Bun
        run: |
          set -euo pipefail
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check WASM dependency lock
        run: cargo metadata --manifest-path wasm/similarity/Cargo.toml --locked --no-deps >/dev/null

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Check WASM formatting
        run: cargo fmt --manifest-path wasm/similarity/Cargo.toml -- --check

      - name: Test WASM similarity core
        run: cargo test --manifest-path wasm/similarity/Cargo.toml --locked

      - name: Lint WASM similarity core
        run: cargo clippy --manifest-path wasm/similarity/Cargo.toml --locked --all-targets -- -D warnings

      - name: Check wasm32 target
        run: cargo check --manifest-path wasm/similarity/Cargo.toml --locked --target wasm32-unknown-unknown

      - name: Build GitHub Pages showcase
        run: bun run build:pages

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
