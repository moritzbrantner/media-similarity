name: Update audio migration lockfile

on:
  push:
    branches: [chore/current-audio-transcription]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/current-audio-transcription
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve current backend dependencies
        run: cargo check --manifest-path backend/Cargo.toml
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- backend/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          git commit -m "Update backend lockfile for current audio transcription"
          git push origin HEAD:chore/current-audio-transcription
