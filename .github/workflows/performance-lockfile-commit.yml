name: Performance lockfile commit

on:
  push:
    branches:
      - perf/iai-callgrind-smoke

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"
          git init --initial-branch=main .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Update lockfile for performance dependency
        run: cargo fetch --manifest-path backend/Cargo.toml

      - name: Commit generated lockfile
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: perf/iai-callgrind-smoke
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/Cargo.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          git commit -m "Update lockfile for Iai-Callgrind"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w 0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${TARGET_BRANCH}"
